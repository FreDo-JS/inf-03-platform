# nginx dla Tebby na VPS u hostingodawcy.
#
# Dwa adresy, bo przeglądarka ucznia rozmawia i z aplikacją, i z Supabase:
#   tebby.przyklad.pl     → Next.js (kontener na 127.0.0.1:3000)
#   api.tebby.przyklad.pl → Supabase (Kong z oficjalnego compose'a, :8000)
#
# Certyfikaty wystawia certbot (--nginx); bloki ssl_* dopisuje sam przy
# pierwszym uruchomieniu. Podmień nazwy domen na swoje.
#
# WAŻNE: nie dokładaj tu nagłówków bezpieczeństwa. Aplikacja ustawia własne
# CSP z nonce liczonym per żądanie (middleware.ts) — drugi, statyczny
# nagłówek z nginxa nadpisałby je i wywrócił hydrację.

# Potrzebne dla WebSocketów Realtime. Musi stać w kontekście http —
# pliki z sites-enabled są włączane właśnie tam, więc to miejsce jest dobre.
map $http_upgrade $polaczenie_upgrade {
    default upgrade;
    ''      close;
}

# --- przekierowanie na HTTPS -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tebby.przyklad.pl api.tebby.przyklad.pl;

    # certbot musi móc odpowiedzieć na wyzwanie
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- aplikacja ---------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tebby.przyklad.pl;

    # ssl_certificate / ssl_certificate_key — dopisze certbot

    # Aplikacja nie używa WebSocketów (Realtime idzie prosto do Supabase),
    # więc nagłówków Upgrade tu nie ma.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Monaco: 24 MB plików o stałych nazwach, pobierane raz na pracownię.
    location /monaco/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# --- Supabase (Kong) ---------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.tebby.przyklad.pl;

    # ssl_certificate / ssl_certificate_key — dopisze certbot

    # Import bazy ze starego projektu i zapisy prac uczniów.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ADRES KLIENTA — nie dokładaj tu nic z $proxy_add_x_forwarded_for.
        # Limity prób PIN-u w bazie (funkcja client_ip) ufają nagłówkom
        # cf-connecting-ip, x-real-ip i x-forwarded-for, w tej kolejności.
        # Na hostowanym Supabase ustawia je Cloudflare, ale tu przed bazą stoi
        # tylko nginx: bez nadpisania uczeń wysyła własny "CF-Connecting-IP"
        # i każda próba liczy się jako inny komputer, więc limit nie działa
        # i PIN da się zgadnąć (audyt z 25.10.2026, znalezisko H4).
        # Wszystkie trzy nagłówki dostają więc prawdziwy adres połączenia.
        # (Gdybyś kiedyś postawił przed nginxem Cloudflare albo inny proxy,
        # tu trzeba wstawić moduł realip, a nie wierzyć nagłówkom.)
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header CF-Connecting-IP  $remote_addr;
        proxy_set_header True-Client-IP    "";

        # Realtime chodzi po WebSockecie — bez tego monitoring sesji
        # i lista testów na żywo przestaną się odświeżać.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $polaczenie_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
